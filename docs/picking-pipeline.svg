<svg width="680" height="514" viewBox="0 0 680 514" xmlns="http://www.w3.org/2000/svg" role="img">
<title>How a mouse click becomes a point in KodaCAD2</title>
<desc>A Qt mouse click forks into two possible pick pipelines depending on which selection mode a tool armed: a native OCCT 3D pick, or the 2D sketch engine's own pixel-to-workplane math. Both converge on one callback dispatcher that hands the result to the active tool's code.</desc>
<rect x="0" y="0" width="680" height="514" fill="#FFFFFF"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="210" y="40" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="60" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Mouse click (KodaViewport)</text>
<text x="340" y="78" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">path depends on active mode</text>

<line x1="340" y1="96" x2="175" y2="166" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="96" x2="485" y2="166" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="40" y="166" width="270" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="175" y="186" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">3D OCCT pick</text>
<text x="175" y="204" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">context.SelectedShape()</text>

<rect x="350" y="166" width="270" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="485" y="186" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">2D engine pick</text>
<text x="485" y="204" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">screen_to_uv + entity math</text>

<line x1="175" y1="222" x2="340" y2="292" stroke="#185FA5" stroke-width="0.5" marker-end="url(#arrow-blue)"/>
<line x1="485" y1="222" x2="340" y2="292" stroke="#0F6E56" stroke-width="0.5" marker-end="url(#arrow-teal)"/>

<rect x="200" y="292" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="312" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">call_select_callbacks()</text>
<text x="340" y="330" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">single dispatch point</text>

<line x1="340" y1="348" x2="340" y2="418" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="200" y="418" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="438" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Tool callback code</text>
<text x="340" y="456" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">e.g. wpByPtDirC, clineHC</text>
</svg>
